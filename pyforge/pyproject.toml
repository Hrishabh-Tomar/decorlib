[project]
name = "pyforge-cli"
version = "0.1.0"
description = "Project scaffolding and build CLI, powered by decorlib"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
decorlib = ["decorlib"]

[project.scripts]
pyforge = "pyforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyforge*"]
