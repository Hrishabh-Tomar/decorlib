[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decorlib"
version = "0.1.0"
description = "A small collection of dependency-free, production-minded Python decorators: retry, timeit, cache, log_calls, validate_types."
readme = "decorlib/README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["decorators", "retry", "cache", "logging", "type-validation", "timing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://example.com/decorlib"

[tool.setuptools.packages.find]
where = ["decorlib"]
include = ["decorlib*"]

[tool.pytest.ini_options]
testpaths = ["decorlib/tests"]